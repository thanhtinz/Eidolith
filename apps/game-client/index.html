<title>EIDOLITH – The Forgotten Wilds</title>
<style>

  .eidolith-form { font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #f4f7fa; width: 300px; }

  .eidolith-form button { width: 100%; padding: 12px; margin-top: 8px; border: 0; border-radius: 10px; background: #ffd83d; color: #26303a; font-size: 17px; font-weight: 700; cursor: pointer; font-family: 'Baloo 2', sans-serif; }
  .eidolith-form .switch { background: transparent; color: #aeb9c4; font-weight: 400; font-family: 'Be Vietnam Pro', sans-serif; }
  .eidolith-form .err { color: #ff8a7a; min-height: 20px; font-size: 14px; }
