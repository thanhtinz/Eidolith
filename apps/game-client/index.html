<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="stylesheet" href="fontawesome/css/all.min.css" />
<title>EIDOLITH – The Forgotten Wilds</title>
<style>
  html, body { margin: 0; padding: 0; background: #10131a; height: 100%; overflow: hidden; }
  #game { width: 100%; height: 100%; }
  .eidolith-form { font-family: system-ui, sans-serif; color: #e8e4d8; width: 300px; }
  .eidolith-form input { width: 100%; box-sizing: border-box; margin: 6px 0; padding: 12px; border-radius: 8px; border: 1px solid #4a4436; background: #1c202a; color: #fff; font-size: 16px; }
  .eidolith-form button { width: 100%; padding: 12px; margin-top: 8px; border: 0; border-radius: 8px; background: #c8871e; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  .eidolith-form .switch { background: transparent; color: #cdb87a; font-weight: 400; }
  .eidolith-form .err { color: #ff8a7a; min-height: 20px; font-size: 14px; }
</style>
</head>
